<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forging Tools</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    border: 1px solid #bbb;
    border-radius: 7px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #333;
}

.result {
    margin-top: 25px;
    padding: 20px;
    background: #f0f7ff;
    border-radius: 10px;
    text-align: center;
    font-size: 18px;
    line-height: 1.8;
}

.note {
    text-align: center;
    color: #777;
    margin-top: 20px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Forging Tools</h1>

    <div class="subtitle">
        Billet / Blank Volume & Weight Calculator
    </div>


    <label>Material:</label>

    <select id="material">

        <option value="7.85">Mild Steel</option>

        <option value="7.85">Carbon Steel</option>

        <option value="7.85">C35 / 1045</option>

        <option value="7.85">H13 Tool Steel</option>

        <option value="2.70">Aluminium</option>

        <option value="8.96">Copper</option>

        <option value="8.50">Brass</option>

    </select>


    <label>Billet Shape:</label>

    <select id="shape" onchange="changeFields()">

        <option value="round">
            Round Billet
        </option>

        <option value="square">
            Square Billet
        </option>

        <option value="rectangle">
            Rectangular Billet
        </option>

    </select>


    <div id="fields"></div>


    <label>Quantity (Pieces):</label>

    <input
        type="number"
        id="quantity"
        value="1"
        min="1"
    >


    <button onclick="calculate()">
        Calculate
    </button>


    <div class="result" id="result">

        Enter billet dimensions.

    </div>


    <div class="note">
        All dimensions are in millimeters (mm).
    </div>

</div>


<script>

function changeFields() {

    let shape =
        document.getElementById("shape").value;

    let fields =
        document.getElementById("fields");


    if (shape === "round") {

        fields.innerHTML = `

            <label>Diameter (mm):</label>

            <input
                type="number"
                id="diameter"
                placeholder="Example: 80"
            >

            <label>Length (mm):</label>

            <input
                type="number"
                id="length"
                placeholder="Example: 200"
            >

        `;

    }


    else if (shape === "square") {

        fields.innerHTML = `

            <label>Side (mm):</label>

            <input
                type="number"
                id="side"
                placeholder="Example: 80"
            >

            <label>Length (mm):</label>

            <input
                type="number"
                id="length"
                placeholder="Example: 200"
            >

        `;

    }


    else if (shape === "rectangle") {

        fields.innerHTML = `

            <label>Width (mm):</label>

            <input
                type="number"
                id="width"
                placeholder="Example: 80"
            >

            <label>Height (mm):</label>

            <input
                type="number"
                id="height"
                placeholder="Example: 60"
            >

            <label>Length (mm):</label>

            <input
                type="number"
                id="length"
                placeholder="Example: 200"
            >

        `;
    }
}


function calculate() {

    let density =
        parseFloat(
            document.getElementById("material").value
        );

    let shape =
        document.getElementById("shape").value;

    let quantity =
        parseFloat(
            document.getElementById("quantity").value
        );


    if (!quantity || quantity <= 0) {

        alert("Please enter quantity.");

        return;
    }


    let volume = 0;


    // ROUND BILLET

    if (shape === "round") {

        let diameter =
            parseFloat(
                document.getElementById("diameter").value
            );

        let length =
            parseFloat(
                document.getElementById("length").value
            );


        if (!diameter || !length) {

            alert("Please enter diameter and length.");

            return;
        }


        let radius = diameter / 2;


        volume =
            Math.PI *
            radius *
            radius *
            length;
    }


    // SQUARE BILLET

    else if (shape === "square") {

        let side =
            parseFloat(
                document.getElementById("side").value
            );

        let length =
            parseFloat(
                document.getElementById("length").value
            );


        if (!side || !length) {

            alert("Please enter side and length.");

            return;
        }


        volume =
            side *
            side *
            length;
    }


    // RECTANGULAR BILLET

    else if (shape === "rectangle") {

        let width =
            parseFloat(
                document.getElementById("width").value
            );

        let height =
            parseFloat(
                document.getElementById("height").value
            );

        let length =
            parseFloat(
                document.getElementById("length").value
            );


        if (!width || !height || !length) {

            alert("Please enter all dimensions.");

            return;
        }


        volume =
            width *
            height *
            length;
    }


    // Weight calculation

    let weightPerPiece =
        (volume * density) / 1000000;


    let totalWeight =
        weightPerPiece * quantity;


    // Show result

    document.getElementById("result").innerHTML =

        "<strong>Volume:</strong> " +
        (volume / 1000).toFixed(2) +
        " cm³<br>" +

        "<strong>Weight per Piece:</strong> " +
        weightPerPiece.toFixed(3) +
        " kg<br>" +

        "<strong>Total Weight:</strong> " +
        totalWeight.toFixed(3) +
        " kg";
}


// Load fields
changeFields();

</script>

</body>
</html>
